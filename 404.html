  <script type="text/javascript">
    // Single Page App fallback for GitHub Pages with BrowserRouter
    // This redirects 404s to index.html with the original path as a query parameter
    var path = window.location.pathname;
    var search = window.location.search;
    window.location.replace('/?redirect=' + encodeURIComponent(path) + search);
  </script>
